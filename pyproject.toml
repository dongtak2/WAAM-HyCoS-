[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waam-validator"
dynamic = ["version"]
description = "Deterministic three-robot WAAM path validation simulator"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6",
  "polars==1.44.1",
  "PyYAML==6.0.3",
  "pydantic==2.13.4",
  "shapely==2.1.2",
  "trimesh==5.0.0",
  "fast-simplification==0.2.0",
  "plotly==6.9.0",
  "dash==4.4.1",
  "dash-ag-grid==35.3.0",
  "typer==0.27.1",
  "mapbox-earcut==2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
  "mypy==2.3.1",
  "psutil==7.2.2",
  "types-PyYAML==6.0.12.20260815",
]

[project.scripts]
waam-validator = "waam_validator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waam_validator = ["dashboard/assets/*.css"]

[tool.setuptools.dynamic]
version = {attr = "waam_validator._version.__version__"}

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not performance'"
testpaths = ["tests"]
markers = [
  "performance: resource-intensive performance acceptance tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src/waam_validator"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
  "dash_ag_grid",
  "shapely",
  "shapely.*",
  "trimesh",
  "trimesh.*",
  "plotly",
  "plotly.*",
]
ignore_missing_imports = true
